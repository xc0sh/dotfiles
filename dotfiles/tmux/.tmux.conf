# ~/.tmux.conf — mirrors this machine's Hyprland keybind scheme (mainMod = SUPER)
# wherever tmux has a comparable concept. tmux's "prefix" stands in for SUPER, since
# terminals can't reliably capture Super-key combos.
#
# Source Hyprland config read for this mapping:
#   ~/.config/hypr/conf/keybindings/default.lua

# -- Prefix: Ctrl-a (screen-style, easier reach than default Ctrl-b). Ctrl-b still
# -- works as a fallback so muscle memory from elsewhere isn't broken. --
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g prefix2 C-b
bind C-b send-prefix -2

# -- Terminal / display --
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc,*:RGB"
# tmux only emits an OSC 52 clipboard write (see set-clipboard below) if the
# terminfo entry for whatever $TERM it started under advertises the `Ms`
# capability -- outside that, `set-clipboard on` is a silent no-op regardless
# of terminal or tmux version. `*` scopes this to every terminal tmux sees
# (not just xterm-256color above) so it isn't sensitive to kitty vs. an
# SSH'd-in terminal reporting a different outer $TERM.
set -ag terminal-overrides ',*:Ms=\E]52;c;%p2%s\007'
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -s set-clipboard on   # forward tmux copies to the real host clipboard via OSC 52 -- mouse-mode capturing drag-select otherwise leaves Ctrl+Shift+C with nothing to copy
set -g history-limit 10000
set -g renumber-windows on
# Windows/panes stay 0-indexed on purpose: Hyprland's SUPER+[1..9,0] maps to
# workspace [1..10] (key "0" = the 10th slot, see the modulo trick in
# keybindings/default.lua). tmux's default prefix+[0-9] already selects window N,
# so 0-indexing is what keeps that mapping literal instead of off-by-one.

# -- Reload config -- matches SUPER+CTRL+R "Reload Hyprland configuration" --
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# -- New window (a fresh terminal) -- matches SUPER+RETURN "Open the terminal" --
bind c new-window -c "#{pane_current_path}"
bind Enter new-window -c "#{pane_current_path}"

# -- Splits, opened in the current pane's working directory --
unbind '"'
unbind %
bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# -- Focus movement -- matches SUPER + arrows "Move focus [direction]" --
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# -- Seamless pane<->Neovim-split navigation with unprefixed Ctrl-hjkl
# -- (christoomey/vim-tmux-navigator's own documented snippet, used
# -- verbatim -- it correctly passes Ctrl-hjkl through to Neovim when the
# -- focused pane IS Neovim, rather than always intercepting it here, and
# -- restores Ctrl-l as clear-screen via prefix so that isn't lost). The
# -- nvim side removes its own <C-hjkl> window-nav maps in favor of this
# -- plugin's equivalent (dotfiles/nvim/.config/nvim/lua/config/keymaps.lua).
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind C-l send-keys 'C-l'

# -- Resize -- matches SUPER + SHIFT + arrows "Increase/Reduce window width/height"
# -- (repeatable while held, like Hyprland's `repeating = true`) --
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# -- Swap pane position -- loose analog of SUPER+ALT+arrows "Swap tiled window
# [direction]". tmux panes are ordered, not on a 2D grid like Hyprland's, so all
# four directions resolve to swap-with-previous/next in tile order. --
bind -r M-Up    swap-pane -U
bind -r M-Left  swap-pane -U
bind -r M-Down  swap-pane -D
bind -r M-Right swap-pane -D

# -- Kill pane / kill window -- matches SUPER+Q / SUPER+SHIFT+Q
# -- "Kill active window" / "Quit active window" --
bind Q kill-pane
bind X kill-window

# -- Zoom pane (fullscreen-ish) -- matches SUPER+F / SUPER+M
# -- "Toggle Fullscreen" / "Toggle Maximize" --
bind F resize-pane -Z
bind M resize-pane -Z

# -- Cycle layout -- loose analog of SUPER+J "Toggle split" --
bind J next-layout

# -- Move current window to slot N -- matches SUPER+SHIFT+[1-9,0]
# -- "Move window to workspace N" (tmux sees Shift+digit as the punctuation the
# -- keyboard actually sends: Shift+1 = "!", Shift+2 = "@", etc.) --
bind '!' move-window -t 1
bind '@' move-window -t 2
bind '#' move-window -t 3
bind '$' move-window -t 4
bind '%' move-window -t 5
bind '^' move-window -t 6
bind '&' move-window -t 7
bind '*' move-window -t 8
bind '(' move-window -t 9
bind ')' move-window -t 0

# -- Copy mode -- loose analog of SUPER+V "Open clipboard manager" --
bind V copy-mode
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# -- sesh: zoxide-integrated session picker (already have zoxide wired into
# -- the shells), replacing tmux's own default choose-session on `s` with
# -- something smarter rather than adding a new key. Requires `sesh` on
# -- PATH (not a tmux plugin -- a standalone Go binary). --
bind s display-popup -h 90% -w 75% -E "sesh picker -i"

# -- Status bar -- colors come from @thm_* user options, live-updated by
# -- matugen on every wallpaper change (dotfiles/matugen/.config/matugen/
# -- templates/tmux-colors.conf -> ~/.config/tmux/colors-matugen.conf),
# -- same pattern kitty/waybar/rofi/gtk already use. Fallback defaults set
# -- first so the format strings below still resolve to something sane on
# -- a fresh install, before matugen has ever run once.
set -gq @thm_bg "#0d0d0d"
set -gq @thm_fg "#00ff00"
set -gq @thm_primary "#00ff00"
set -gq @thm_on_primary "#0d0d0d"
set -gq @thm_surface "#0d0d0d"
set -gq @thm_surface_variant "#444444"
set -gq @thm_outline "#444444"
source-file -q ~/.config/tmux/colors-matugen.conf

# status-interval (default 15s) bounds how often the #() shell-out below
# actually re-runs -- tmux caches the result and only re-invokes the
# command on each interval tick, not on every render. ~/.config/tmux/
# status-right.sh does one combined /proc + /sys read (no `top`/`ps`
# subprocess spawn, measured <15ms by hand) rather than several separate
# #() calls -- deliberately avoiding the classic tmux performance pitfall
# of an expensive per-render status segment (e.g. a naive git-branch
# script), which this isn't.
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-left "#{@thm_nested_marker} #S "
set -g status-left-style "bg=#{@thm_primary},fg=#{@thm_on_primary},bold"
set -g status-right "#[fg=#{@thm_outline}]#{b:pane_current_path} #[fg=#{@thm_fg}]| #(~/.config/tmux/status-right.sh) #[fg=#{@thm_primary}]%H:%M "
set -g window-status-current-style "bg=#{@thm_primary},fg=#{@thm_on_primary},bold"
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=#{@thm_primary}"
set -g pane-border-style "fg=#{@thm_surface_variant}"

# -- Nested-session marker -- there's no reliable *automatic* way to detect
# -- "this tmux is itself running inside another tmux" from config alone:
# -- tmux always sets $TMUX freshly for its own panes, so checking its
# -- value from inside never actually reveals an outer session (verified by
# -- hand: nesting one tmux inside another and inspecting $TMUX at each
# -- level shows two independently-valid values, not a stacked one).
# -- Manual toggle instead, for after SSHing into a host that's also
# -- running tmux -- press prefix+N there to mark it, prefix+CTRL+N to
# -- clear it, so it's easy to tell which machine's session a keystroke is
# -- actually going to.
set -g @thm_nested_marker ""
bind N set -g @thm_nested_marker "[NESTED]"
bind C-n set -g @thm_nested_marker ""

# -- Plugins (TPM) -- bootstrap once: git clone
# -- https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm, then
# -- prefix + I inside a session to fetch/install the plugins below. --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-continuum: auto-save every 15 min via tmux-resurrect, auto-restore
# the last saved session when tmux itself (re)starts (e.g. after a reboot).
set -g @continuum-restore 'on'

run -b '~/.tmux/plugins/tpm/tpm'
