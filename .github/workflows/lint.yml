name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck 0.11.0
        run: |
          # Pinned exact version -- "zero findings" is only a meaningful
          # gate if it's checked with the same version the repo was
          # cleaned up against, not whatever apt/ubuntu-latest ships.
          curl -Lo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar xf shellcheck.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/
          shellcheck --version

      - name: Find real shell scripts
        run: |
          # By shebang, not .sh extension: dotfiles/xcloud/.config/xcloud/scripts/*
          # has none, and dotfiles/xcloud/.config/xcloud/settings/*.sh are plain
          # config values with no shebang (except one real exception, editor.sh) --
          # a naive glob gets both of those wrong.
          find . -type f -not -path './.git/*' -exec sh -c '
            head -1 "$1" 2>/dev/null | grep -qE "^#!.*(bash|/bin/sh|/usr/bin/env sh)" && echo "$1"
          ' _ {} \; | sed 's|^\./||' | sort > scripts.txt
          wc -l scripts.txt

      - name: Run shellcheck
        run: shellcheck -x $(cat scripts.txt)

  branding-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for stray ML4W/mylinuxforwork branding
        run: |
          # CREDITS.md and LICENSE carry legitimate upstream attribution.
          # README.md legitimately mentions both terms on 3 lines too (the
          # "personal fork of" line, the installer-app attribution line, and
          # the Credits section) -- excluding only CREDITS/LICENSE would
          # fail this job on day one.
          # This workflow file is also excluded: it legitimately contains
          # both terms in its own check logic below (self-referential).
          if git grep -Iil -E 'ml4w|mylinuxforwork' -- ':!CREDITS.md' ':!LICENSE' ':!README.md' ':!.github/workflows/lint.yml'; then
            echo "::error::Found stray ML4W/mylinuxforwork branding outside the allowed attribution files"
            exit 1
          fi
          echo "Clean."

      - name: Pin README's expected legitimate mention count
        run: |
          count=$(git grep -Iich -E 'ml4w|mylinuxforwork' README.md)
          if [ "$count" != "3" ]; then
            echo "::error::README.md now has $count ml4w/mylinuxforwork mentions, expected exactly 3 -- review whether this is a legitimate doc change or drift"
            exit 1
          fi
          echo "README.md mention count OK ($count)."

  setup-scripts-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check every setup/*.sh script
        run: |
          # Fast, always-on parse check for every setup script -- a cheap
          # first line of defense before the much slower real-container run
          # below actually executes them.
          status=0
          for f in setup/*.sh; do
            if ! bash -n "$f"; then
              echo "::error file=$f::Syntax error"
              status=1
            fi
          done
          exit $status

  install-flow-smoke-test:
    runs-on: ubuntu-latest
    container: archlinux:base
    # Does real package installation in a throwaway container, so it's
    # slower and more network-dependent than the other jobs -- but this is
    # a low-traffic personal repo, not a high-volume one, so the always-on
    # cost is worth it: this exact class of bug (clean shellcheck, broken
    # in a real run) shipped and stayed shipped before because nothing
    # ever actually executed the install path in CI.
    steps:
      - name: Install git (actions/checkout needs it; base image is minimal)
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v4

      - name: Create a non-root user
        # The installer shells out to `sudo`, and several distro package
        # managers (this repo's own check_and_install pattern) refuse to
        # run as root -- run the actual test as an unprivileged user with
        # passwordless sudo, matching a real workstation, not the
        # container's default root.
        run: |
          pacman -S --needed --noconfirm sudo
          useradd -m -G wheel builder
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel
          chmod 0440 /etc/sudoers.d/wheel
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Fork+install xcloud-dotfiles-installer and run this checkout in --testmode
        run: |
          su builder -c '
            set -e
            cd "$GITHUB_WORKSPACE"
            sudo pacman -Sy --needed --noconfirm git make jq curl
            curl -fsSL https://raw.githubusercontent.com/xc0sh/xcloud-dotfiles-installer/main/demo/setup.sh -o /tmp/installer-setup.sh
            # Run everything the bootstrap script does except its final
            # --install call, which targets the *published* xc0sh/dotfiles
            # on GitHub main -- not this checkout, mid-PR. Install the
            # installer app itself, then point it at this checkout, with
            # source rewritten from the published git URL to a local path
            # so read_dotinst copies this checkout instead of cloning main.
            sed -i "/xcloud-dotfiles-installer --install/d" /tmp/installer-setup.sh
            bash /tmp/installer-setup.sh
            jq --arg src "$GITHUB_WORKSPACE" ".source = \$src" hyprland-dotfiles.dotinst > /tmp/ci-test.dotinst
            xcloud-dotfiles-installer --install /tmp/ci-test.dotinst --testmode
          '

  stow-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow

      - name: Dry-run stow into a scratch HOME
        run: |
          # A scratch target, not a real $HOME -- a real machine's $HOME has
          # pre-existing .bashrc/.zshrc/GTK-generated files that would cause
          # false-positive conflicts unrelated to the package layout itself.
          mkdir -p /tmp/stow-check
          cd dotfiles
          packages=$(ls -d */ | sed 's#/##')
          stow -n -v -t /tmp/stow-check -d . $packages 2>&1 | tee /tmp/stow-out.log
          if grep -qi 'existing target is neither' /tmp/stow-out.log || grep -qi 'conflict' /tmp/stow-out.log; then
            echo "::error::Stow reported conflicts -- see log above"
            exit 1
          fi
          echo "Clean."
